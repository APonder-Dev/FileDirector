version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      avalonia:
        patterns:
          - "Avalonia*"
      entity-framework:
        patterns:
          - "Microsoft.EntityFrameworkCore*"
      testing:
        patterns:
          - "xunit*"
          - "Microsoft.NET.Test.Sdk"
          - "coverlet.collector"
          - "FluentAssertions"
          - "NSubstitute"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
