name: Bug report
description: Report unexpected or incorrect behavior in FileDirector.
title: "bug: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Since FileDirector moves and modifies
        files, please include as much detail as possible so we can reproduce safely.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Rule configuration, directory structure, and the exact commands/UI actions used.
      placeholder: |
        1. Register directory '...'
        2. Define rule '...'
        3. Run 'filedirector preview ...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Paste sanitized log output (remove personal file paths/names if sensitive).
      render: shell

  - type: input
    id: version
    attributes:
      label: FileDirector version
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - Linux
        - macOS
    validations:
      required: true

  - type: dropdown
    id: interface
    attributes:
      label: Interface
      options:
        - Desktop
        - CLI
        - Both
    validations:
      required: true

  - type: checkboxes
    id: data-loss
    attributes:
      label: Impact
      options:
        - label: This bug resulted in unexpected file movement, modification, or data loss
