name: Release

on:
  push:
    tags:
      - "v*.*.*"

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "9.0.x"
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      - run: dotnet test --no-build --configuration Release

  package:
    name: Package (${{ matrix.rid }})
    needs: build-and-test
    strategy:
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-latest
          - rid: osx-x64
            os: macos-latest
          - rid: osx-arm64
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "9.0.x"

      - name: Publish CLI
        run: >
          dotnet publish src/FileDirector.Cli/FileDirector.Cli.csproj
          -c Release -r ${{ matrix.rid }} --self-contained true
          -p:PublishSingleFile=true -p:PublishTrimmed=false
          -o publish/${{ matrix.rid }}/cli

      - name: Publish Desktop
        run: >
          dotnet publish src/FileDirector.Desktop/FileDirector.Desktop.csproj
          -c Release -r ${{ matrix.rid }} --self-contained true
          -p:PublishSingleFile=true -p:PublishTrimmed=false
          -o publish/${{ matrix.rid }}/desktop

      - name: Archive (zip)
        shell: bash
        run: |
          cd publish/${{ matrix.rid }}
          zip -r ../../FileDirector-${{ github.ref_name }}-${{ matrix.rid }}.zip cli desktop

      - name: Checksum
        shell: bash
        run: |
          sha256sum FileDirector-${{ github.ref_name }}-${{ matrix.rid }}.zip > FileDirector-${{ github.ref_name }}-${{ matrix.rid }}.zip.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FileDirector-${{ github.ref_name }}-${{ matrix.rid }}
          path: |
            FileDirector-${{ github.ref_name }}-${{ matrix.rid }}.zip
            FileDirector-${{ github.ref_name }}-${{ matrix.rid }}.zip.sha256

  publish-release:
    name: Publish GitHub Release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: artifacts/**
